# Shared host TLS edge. The Compose gateway owns website authentication.
server {
    listen 80;
    server_name crypto-trader.nechek805.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/crypto-trader-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name crypto-trader.nechek805.org;
    ssl_certificate /etc/letsencrypt/live/crypto-trader.nechek805.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crypto-trader.nechek805.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 32k;
    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Crypto-Proxy-Auth "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
}
